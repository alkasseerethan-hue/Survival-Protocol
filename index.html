<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SURVIVAL PROTOCOL</title>
<style>
:root { color-scheme: dark; --red:#a80000; --green:#16a34a; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; color:#f5f5f5; font-family:Arial,Helvetica,sans-serif; background:#080808; }
body::before { content:""; position:fixed; inset:0; background:linear-gradient(#000b,#000d),url("./Background.jpg") center/cover fixed; z-index:-1; }
main { width:min(1100px,94%); margin:auto; padding:30px 0 60px; }
header { text-align:center; padding:20px 0 26px; }
h1 { margin:0; letter-spacing:.13em; color:#f3f3f3; font-size:clamp(2rem,5vw,3.6rem); text-shadow:0 0 20px #a00; }
.subtitle { color:#ccc; letter-spacing:.18em; margin-top:10px; }
.notice { border:1px solid #444; background:#080808cc; border-radius:8px; padding:12px 15px; margin:14px 0; line-height:1.5; }
.status { color:#ddd; min-height:1.4em; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:14px; margin:20px 0 26px; }
.character { padding:0; overflow:hidden; background:#111; border:1px solid #444; border-radius:8px; color:white; cursor:pointer; text-align:left; transition:border-color .2s,transform .2s; }
.character:hover { border-color:#c00; transform:translateY(-2px); }
.character.selected { border:2px solid #e11; box-shadow:0 0 14px #a00a; }
.character img { width:100%; height:175px; display:block; object-fit:cover; background:#222; }
.character span { display:block; padding:10px; font-weight:700; min-height:42px; }
.panel { background:#0b0b0bed; border:1px solid #393939; border-radius:10px; padding:18px; margin:18px 0; }
#selected-character { font-weight:700; margin-bottom:14px; color:#fff; }
.actions { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0; }
.action-button { background:#fff; color:#111; border:1px solid #ccc; padding:12px 18px; border-radius:6px; cursor:pointer; font-weight:700; transition:background-color .2s,color .2s,border-color .2s; }
.action-button:disabled { opacity:.65; cursor:wait; }
.action-button.verified,.action-button.completed { background:#16a34a; color:#fff; border-color:#16a34a; }
textarea { width:100%; min-height:85px; resize:vertical; background:#171717; color:white; border:1px solid #555; border-radius:6px; padding:12px; font:inherit; }
.results { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:8px; }
.result-row { background:#171717; border:1px solid #333; padding:10px 12px; border-radius:6px; display:flex; justify-content:space-between; gap:10px; }
.small { color:#aaa; font-size:.9rem; }
a { color:#fff; }
@media(max-width:500px) { .character img { height:145px; } .actions .action-button { width:100%; } }
</style>
</head>
<body>
<main>
<header>
<h1>SURVIVAL PROTOCOL</h1>
<div class="subtitle">اختر الناجي</div>
</header>

<div class="notice">
  <div id="status" class="status">تحقّق من اشتراكك بقناة يوتيوب قبل التصويت.</div>
</div>

<section>
<h2>اختر شخصيتك</h2>
<div id="characters" class="grid"></div>
</section>

<section class="panel" id="voting-panel">
<div id="selected-character">لم يتم اختيار شخصية.</div>
<div class="actions">
<button id="verify-subscription" class="action-button" type="button">تحقّق من اشتراك يوتيوب</button>
<button id="subscribe-channel" class="action-button" type="button">اشترك في قناتنا على يوتيوب</button>
</div>
<textarea id="vote-reason" placeholder="ليش اخترت هالشخصية؟ (اختياري)"></textarea>
<div class="actions">
<button id="submit-vote" class="action-button" type="button">تصويت</button>
<button id="refresh-results" class="action-button" type="button">تحديث النتائج</button>
</div>
<p class="small">جلسة التحقق صالحة لمدة تصل إلى ساعة. لازم تشترك بالقناة بنفسك من يوتيوب.</p>
</section>

<section class="panel">
<h2>نتائج التصويت</h2>
<div id="top-character" class="notice">لا توجد أصوات بعد.</div>
<div id="all-results" class="results"></div>
</section>
</main>
<script>
const API_URL = "https://soft-sun-0c0e.alkasseerethan.workers.dev";
const CHANNEL_URL = "https://www.youtube.com/@EthanWinters.7.8";
const characters = [
  ["Leon S. Kennedy","Leon.jpg"],["Chris Redfield","Chris.jpg"],["Jill Valentine","Jill.jpg"],
  ["Ada Wong","Ada.jpg"],["Claire Redfield","Claire.jpg"],["Sherry Birkin","Sherry.jpg"],
  ["Rebecca Chambers","Rebecca.jpg"],["Ethan Winters","Ethan.jpg"],["Barry Burton","Barry.jpg"],
  ["Luis Sera","Luis.jpg"],["Albert Wesker","Wesker.jpg"],["Hunk","Hunk.jpg"],
  ["Jack Krauser","Krauser.jpg"],["Alcina Dimitrescu","Dimitrescu.jpg"],["Jack Baker","Baker.jpg"],
  ["Karl Heisenberg","Heisenberg.jpg"],["Oswell E. Spencer","Spencer.jpg"],["Ramon Salazar","Salazar.jpg"],
  ["Zeno","Zeno.jpg"]
];
let selectedCharacter = "";
let votes = {};
let sessionToken = localStorage.getItem("youtubeSession") || "";
const voteId = {};

const statusEl = document.getElementById("status");
const verifyButton = document.getElementById("verify-subscription");
const subscribeButton = document.getElementById("subscribe-channel");
const voteButton = document.getElementById("submit-vote");

function setStatus(message) { statusEl.textContent = message; }

function renderCharacters() {
  const grid = document.getElementById("characters");
  characters.forEach(([name, image]) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "character";
    button.setAttribute("aria-label", name);
    const img = document.createElement("img");
    img.src = image;
    img.alt = name;
    img.loading = "lazy";
    img.onerror = () => { img.alt = "تعذّر تحميل صورة " + name; img.style.display = "block"; img.style.objectFit = "contain"; };
    const label = document.createElement("span");
    label.textContent = name;
    const count = document.createElement("span");
    count.className = "small";
    count.id = "vote-count-" + slug(name);
    count.textContent = "الأصوات: 0";
    button.append(img, label, count);
    button.addEventListener("click", () => selectCharacter(name, button));
    grid.appendChild(button);
    voteId[name] = count.id;
  });
}
function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }

function selectCharacter(character, card) {
  selectedCharacter = character;
  document.querySelectorAll(".character").forEach(el => el.classList.remove("selected"));
  if (card) card.classList.add("selected");
  document.getElementById("selected-character").textContent = "تم اختيار: " + character;
  document.getElementById("voting-panel").scrollIntoView({ behavior:"smooth", block:"center" });
}

function readSessionFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const incoming = params.get("session");
  const result = params.get("youtube");
  if (incoming) {
    sessionToken = incoming;
    localStorage.setItem("youtubeSession", incoming);
    verifyButton.classList.add("verified");
    setStatus("YouTube subscription verified. You can now vote.");
  } else if (result === "not_subscribed") {
    setStatus("This Google account does not appear to be subscribed to the channel. Subscribe on YouTube, then verify again.");
  } else if (result === "error") {
    setStatus("YouTube verification failed. Please try again.");
  }
  if (params.has("session") || params.has("youtube")) {
    history.replaceState({}, document.title, window.location.pathname);
  }
}
verifyButton.addEventListener("click", () => { window.location.href = API_URL + "/auth"; });
subscribeButton.addEventListener("click", () => { window.open(CHANNEL_URL, "_blank", "noopener,noreferrer"); });

async function submitVote() {
  if (!selectedCharacter) { alert("Please choose a character first."); return; }
  if (!sessionToken) {
    setStatus("Please verify your YouTube subscription before voting.");
    alert("Please verify your YouTube subscription first.");
    return;
  }
  voteButton.disabled = true;
  const oldText = voteButton.textContent;
  voteButton.textContent = "SUBMITTING...";
  try {
    const response = await fetch(API_URL + "/vote", {
      method:"POST",
      headers: { "Content-Type":"application/json", "Authorization":"Bearer " + sessionToken },
      body: JSON.stringify({ character:selectedCharacter, reason:document.getElementById("vote-reason").value.trim() })
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || !data.success) {
      if (response.status === 401) {
        sessionToken = "";
        localStorage.removeItem("youtubeSession");
        verifyButton.classList.remove("verified");
        setStatus("Verification expired. Verify your YouTube subscription again.");
      }
      throw new Error(data.error || ("Vote failed (HTTP " + response.status + ")"));
    }
    votes[selectedCharacter] = data.votes;
    const countEl = document.getElementById(voteId[selectedCharacter]);
    if (countEl) countEl.textContent = "الأصوات: " + data.votes;
    document.getElementById("vote-reason").value = "";
    voteButton.classList.add("completed");
    setStatus("Vote successfully submitted for " + selectedCharacter + ".");
    await loadVotes();
    alert("Vote submitted for: " + selectedCharacter);
  } catch (error) {
    console.error("Vote submission error:", error);
    setStatus("Could not submit vote: " + error.message);
    alert("Could not submit the vote: " + error.message);
  } finally {
    voteButton.disabled = false;
    voteButton.textContent = oldText;
  }
}
voteButton.addEventListener("click", submitVote);

async function loadVotes() {
  try {
    const response = await fetch(API_URL + "/votes");
    if (!response.ok) throw new Error("Could not load results");
    votes = await response.json();
    for (const [name] of characters) {
      const el = document.getElementById(voteId[name]);
      if (el) el.textContent = "الأصوات: " + (votes[name] || 0);
    }
    updateResults();
  } catch (error) {
    console.error("Loading votes failed:", error);
    document.getElementById("all-results").textContent = "تعذّر تحميل الأصوات حالياً. حاول تحديث النتائج.";
  }
}
function updateResults() {
  const entries = characters.map(([name]) => [name, Number(votes[name] || 0)])
    .sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const top = entries[0];
  document.getElementById("top-character").textContent =
    top && top[1] > 0 ? "المتصدر: " + top[0] + " (" + top[1] + " صوت)" : "لا توجد أصوات بعد.";
  const all = document.getElementById("all-results");
  all.replaceChildren();
  entries.forEach(([name,count]) => {
    const row = document.createElement("div");
    row.className = "result-row";
    const n = document.createElement("span"); n.textContent = name;
    const c = document.createElement("strong"); c.textContent = String(count);
    row.append(n,c); all.appendChild(row);
  });
}

renderCharacters();
readSessionFromUrl();
loadVotes();
</script>
</body>
</html>
